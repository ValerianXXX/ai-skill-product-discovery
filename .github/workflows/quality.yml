name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository checks
        run: python scripts/check_repo.py

      - name: Validate benchmark contracts without model calls
        run: python -m unittest discover -s tests -v

      - name: Recompute shared-evidence outcomes and artifact receipts
        run: python scripts/shared_evidence_report.py --check benchmarks/2026-10-29/analysis.json
